<div id="root" style="background:var(--bg-canvas);height:300px;position:relative;box-sizing:border-box;padding:24px"></div>
<script type="text/babel">
const { Dialog, Tooltip, DropdownMenu, IconButton, Button } = window.VaultDesignSystem_72e5ce;
function Demo(){
  const [menuOpen,setMenuOpen]=React.useState(true);
  return (
    <div style={{display:'flex',gap:40,alignItems:'flex-start',fontFamily:'var(--font-sans)'}}>
      <Tooltip label="Download original"><IconButton icon="download" variant="secondary" aria-label="Download" /></Tooltip>
      <DropdownMenu open={menuOpen} onOpenChange={setMenuOpen} trigger={<IconButton icon="more-horizontal" variant="secondary" aria-label="More" />} items={[{label:'Download',icon:'download'},{label:'Rename',icon:'pencil'},{label:'Delete',icon:'trash-2',danger:true}]} />
      <Dialog open title="Reject this video?" description="onboarding_v3.mp4 will be sent back to the uploader." footer={<><Button variant="secondary" size="sm">Cancel</Button><Button variant="danger" size="sm">Reject</Button></>} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
