<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<div id="root" style="background:var(--bg-canvas);padding:24px;box-sizing:border-box"></div>
<script type="text/babel">
const { Table, Avatar, Card, StatusPill } = window.VaultDesignSystem_72e5ce;
const rows = [
  { name: 'onboarding_v3.mp4', owner: 'Marta Reyes', status: 'approved' },
  { name: 'q3_recap_final.mov', owner: 'Devon Lee', status: 'pending' },
  { name: 'raw_capture_09.mkv', owner: 'Priya Nair', status: 'rejected' },
];
function Demo(){
  return (
    <div style={{display:'flex',flexDirection:'column',gap:16,fontFamily:'var(--font-sans)'}}>
      <Card>
        <Table columns={[
          {key:'name',label:'File',mono:true},
          {key:'owner',label:'Owner',render:r=><div style={{display:'flex',alignItems:'center',gap:8}}><Avatar name={r.owner} size="sm"/>{r.owner}</div>},
          {key:'status',label:'Status',render:r=><StatusPill status={r.status}/>},
        ]} rows={rows} />
      </Card>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
