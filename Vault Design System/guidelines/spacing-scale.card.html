<!-- @dsCard group="Spacing" viewport="700x150" name="4px scale" subtitle="space-1 through space-9" -->
<link rel="stylesheet" href="../styles.css">
<div style="height:150px;background:var(--bg-app);font-family:var(--font-mono);display:flex;align-items:flex-end;gap:10px;padding:16px 20px;box-sizing:border-box">
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-1);height:var(--space-1);background:var(--accent)"></div><span style="font-size:10px;color:var(--text-tertiary)">1</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-2);height:var(--space-2);background:var(--accent)"></div><span style="font-size:10px;color:var(--text-tertiary)">2</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-3);height:var(--space-3);background:var(--accent)"></div><span style="font-size:10px;color:var(--text-tertiary)">3</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-4);height:var(--space-4);background:var(--accent)"></div><span style="font-size:10px;color:var(--text-tertiary)">4</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-5);height:var(--space-5);background:var(--accent)"></div><span style="font-size:10px;color:var(--text-tertiary)">5</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-6);height:var(--space-6);background:var(--accent)"></div><span style="font-size:10px;color:var(--text-tertiary)">6</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-7);height:var(--space-7);background:var(--accent)"></div><span style="font-size:10px;color:var(--text-tertiary)">7</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-8);height:var(--space-8);background:var(--accent)"></div><span style="font-size:10px;color:var(--text-tertiary)">8</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-9);height:var(--space-9);background:var(--accent)"></div><span style="font-size:10px;color:var(--text-tertiary)">9</span></div>
</div>
