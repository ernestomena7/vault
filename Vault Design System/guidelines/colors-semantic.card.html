<!-- @dsCard group="Colors" viewport="700x150" name="Semantic / status" subtitle="Pending, approved, rejected, processing" -->
<link rel="stylesheet" href="../styles.css">
<div style="height:150px;background:var(--bg-app);font-family:var(--font-sans);display:flex;gap:12px;align-items:center;padding:0 16px;box-sizing:border-box">
<div style="flex:1;background:var(--status-pending-bg);border:1px solid var(--status-pending);border-radius:var(--radius-md);padding:14px;color:var(--status-pending);font-size:13px;font-weight:600">Pending</div>
<div style="flex:1;background:var(--status-approved-bg);border:1px solid var(--status-approved);border-radius:var(--radius-md);padding:14px;color:var(--status-approved);font-size:13px;font-weight:600">Approved</div>
<div style="flex:1;background:var(--status-rejected-bg);border:1px solid var(--status-rejected);border-radius:var(--radius-md);padding:14px;color:var(--status-rejected);font-size:13px;font-weight:600">Rejected</div>
<div style="flex:1;background:var(--status-processing-bg);border:1px solid var(--status-processing);border-radius:var(--radius-md);padding:14px;color:var(--status-processing);font-size:13px;font-weight:600">Processing</div>
</div>
