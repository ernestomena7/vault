<!-- @dsCard group="Spacing" viewport="700x180" name="Elevation & glass" subtitle="Shadows reserved for floating chrome; blur for overlays" -->
<link rel="stylesheet" href="../styles.css">
<div style="height:180px;background:var(--bg-canvas);font-family:var(--font-sans);display:flex;gap:16px;align-items:center;padding:20px;box-sizing:border-box">
<div style="flex:1;height:110px;background:var(--bg-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-tertiary)">shadow-sm</div>
<div style="flex:1;height:110px;background:var(--bg-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-tertiary)">shadow-md</div>
<div style="flex:1;height:110px;background:var(--bg-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-tertiary)">shadow-lg</div>
<div style="flex:1;height:110px;background:var(--bg-surface-glass);backdrop-filter:blur(var(--blur-panel));-webkit-backdrop-filter:blur(var(--blur-panel));border:1px solid var(--border-subtle);border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-secondary)">glass panel</div>
</div>
