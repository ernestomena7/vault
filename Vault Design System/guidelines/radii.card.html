<!-- @dsCard group="Spacing" viewport="700x150" name="Corner radii" subtitle="Tight, technical — nothing over-rounded" -->
<link rel="stylesheet" href="../styles.css">
<div style="height:150px;background:var(--bg-app);font-family:var(--font-sans);display:flex;align-items:center;gap:16px;padding:16px 20px;box-sizing:border-box">
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:64px;height:64px;background:var(--bg-surface-raised);border:1px solid var(--border-subtle);border-radius:var(--radius-sm)"></div><span style="font-size:11px;color:var(--text-tertiary)">sm 4px</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:64px;height:64px;background:var(--bg-surface-raised);border:1px solid var(--border-subtle);border-radius:var(--radius-md)"></div><span style="font-size:11px;color:var(--text-tertiary)">md 8px</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:64px;height:64px;background:var(--bg-surface-raised);border:1px solid var(--border-subtle);border-radius:var(--radius-lg)"></div><span style="font-size:11px;color:var(--text-tertiary)">lg 12px</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:64px;height:64px;background:var(--bg-surface-raised);border:1px solid var(--border-subtle);border-radius:var(--radius-xl)"></div><span style="font-size:11px;color:var(--text-tertiary)">xl 16px</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:64px;height:64px;background:var(--bg-surface-raised);border:1px solid var(--border-subtle);border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-secondary)">full</div><span style="font-size:11px;color:var(--text-tertiary)">pill</span></div>
</div>
