<!-- @dsCard group="Type" viewport="700x190" name="Body & label" subtitle="Body copy, secondary text, uppercase labels" -->
<link rel="stylesheet" href="../styles.css">
<div style="height:190px;background:var(--bg-app);font-family:var(--font-sans);padding:16px 20px;box-sizing:border-box;color:var(--text-primary)">
<div style="font-size:var(--text-body-lg);line-height:var(--leading-body-lg)">Body lg 16px — approvers see every upload before it goes live.</div>
<div style="font-size:var(--text-body-md);line-height:var(--leading-body-md);margin-top:8px;color:var(--text-secondary)">Body md 14px — the default UI copy size for lists, forms, cards.</div>
<div style="font-size:var(--text-body-sm);line-height:var(--leading-body-sm);margin-top:8px;color:var(--text-tertiary)">Body sm 13px — helper text, table cells, timestamps.</div>
<div style="font-size:var(--text-label);letter-spacing:var(--tracking-label);text-transform:uppercase;margin-top:10px;color:var(--text-tertiary);font-weight:var(--fw-semibold)">Label 12px uppercase</div>
</div>
