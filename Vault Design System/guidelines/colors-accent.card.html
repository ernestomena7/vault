<!-- @dsCard group="Colors" viewport="700x170" name="Accent — indigo" subtitle="The one accent color for actions, focus, progress" -->
<link rel="stylesheet" href="../styles.css">
<div style="height:170px;background:var(--bg-app);font-family:var(--font-sans);padding:14px 0;box-sizing:border-box">
<div style="display:flex;height:80px">
<div style="flex:1;background:var(--indigo-900)"></div><div style="flex:1;background:var(--indigo-800)"></div><div style="flex:1;background:var(--indigo-700)"></div><div style="flex:1;background:var(--indigo-600)"></div><div style="flex:1;background:var(--indigo-500);box-shadow:var(--glow-accent)"></div><div style="flex:1;background:var(--indigo-400)"></div><div style="flex:1;background:var(--indigo-300)"></div><div style="flex:1;background:var(--indigo-200)"></div><div style="flex:1;background:var(--indigo-100)"></div><div style="flex:1;background:var(--indigo-50)"></div>
</div>
<div style="display:flex;gap:16px;margin-top:14px;padding:0 4px">
<div style="width:14px;height:14px;border-radius:3px;background:var(--accent)"></div><span style="font-size:12px;color:var(--text-secondary)">--accent #6e5bff</span>
<div style="width:14px;height:14px;border-radius:3px;background:var(--accent-hover);margin-left:16px"></div><span style="font-size:12px;color:var(--text-secondary)">hover</span>
<div style="width:14px;height:14px;border-radius:3px;background:var(--accent-active);margin-left:16px"></div><span style="font-size:12px;color:var(--text-secondary)">active</span>
</div>
</div>
